name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install PyYAML
    - name: Generated manifests are current
      run: python3 scripts/render_adapters.py --check
    - name: Gemini distribution builds
      run: python3 scripts/render_adapters.py --package gemini-cli
    - name: Unit tests
      run: python3 -m unittest discover -s scripts -t scripts -v
    - name: Bundled example model validates
      run: python3 scripts/check_project.py validate assets/project.example.json
